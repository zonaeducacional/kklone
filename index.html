<!DOCTYPE html>
<html lang="pt" class="">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, 
        maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#1a1a1a">
  <title>Reader</title>
  <link rel="stylesheet" href="lib/tailwind.min.css">
  <link rel="stylesheet" href="css/app.css">
  <script src="lib/epub.min.js"></script>
  <script src="lib/pdf.min.js"></script>
</head>
<body class="bg-[#f5f0e8] dark:bg-[#1a1a1a] text-[#2d2d2d] 
             dark:text-[#b0b0b0] select-none overflow-hidden">

  <!-- ═══════════════ BIBLIOTECA (Ecrã inicial) ═══════════════ -->
  <div id="library-screen" class="fixed inset-0 flex flex-col z-10">
    <!-- Barra superior -->
    <header class="flex items-center justify-between px-6 py-4 
                   border-b border-[#e0d8c8] dark:border-[#333]">
      <h1 class="text-xl font-semibold tracking-wide">A minha biblioteca</h1>
      <div class="flex gap-3">
        <button id="btn-night-toggle" class="p-2 rounded-lg 
                hover:bg-[#e8e0d0] dark:hover:bg-[#333] transition"
                aria-label="Modo noturno">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" 
               stroke-width="2" viewBox="0 0 24 24">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
          </svg>
        </button>
        <button id="btn-sync" class="p-2 rounded-lg 
                hover:bg-[#e8e0d0] dark:hover:bg-[#333] transition"
                aria-label="Sincronizar">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" 
               stroke-width="2" viewBox="0 0 24 24">
            <path d="M23 4v6h-6M1 20v-6h6"/>
            <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>
          </svg>
        </button>
        <button id="btn-import" class="p-2 rounded-lg 
                hover:bg-[#e8e0d0] dark:hover:bg-[#333] transition"
                aria-label="Importar livro">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" 
               stroke-width="2" viewBox="0 0 24 24">
            <path d="M12 5v14M5 12h14"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- Grelha de livros -->
    <main class="flex-1 overflow-y-auto p-6">
      <div id="book-grid" 
           class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-5">
        <!-- Preenchido dinamicamente por app.js -->
      </div>
      <p id="empty-library" class="hidden text-center mt-20 opacity-50 text-lg">
        Nenhum livro encontrado.<br>
        <span class="text-sm">Toca em + para importar do pendrive.</span>
      </p>
    </main>

    <!-- Barra inferior minimalista -->
    <footer class="flex justify-center gap-8 py-3 
                   border-t border-[#e0d8c8] dark:border-[#333] text-xs opacity-60">
      <span id="storage-indicator">Armazenamento: —</span>
      <span id="wifi-indicator">Wi-Fi: —</span>
    </footer>
  </div>

  <!-- ═══════════════ LEITOR (Ecrã de leitura) ═══════════════ -->
  <div id="reader-screen" class="fixed inset-0 hidden flex-col z-20">
    <!-- Barra de estado do leitor (oculta até tocar) -->
    <div id="reader-toolbar" 
         class="absolute top-0 left-0 right-0 flex items-center justify-between 
                px-4 py-3 bg-[#f5f0e8]/95 dark:bg-[#1a1a1a]/95 
                backdrop-blur border-b border-[#e0d8c8] dark:border-[#333] 
                z-30 transition-opacity duration-300 opacity-0">
      <button id="btn-back" class="p-2 rounded-lg hover:bg-[#e8e0d0] 
              dark:hover:bg-[#333]">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" 
             stroke-width="2" viewBox="0 0 24 24">
          <path d="M19 12H5M12 19l-7-7 7-7"/>
        </svg>
      </button>
      <span id="book-title" class="text-sm truncate max-w-[60%] opacity-70"></span>
      <div class="flex gap-2">
        <button id="btn-font-decrease" class="p-2 rounded-lg 
                hover:bg-[#e8e0d0] dark:hover:bg-[#333] text-xs font-bold">A-</button>
        <button id="btn-font-increase" class="p-2 rounded-lg 
                hover:bg-[#e8e0d0] dark:hover:bg-[#333] text-xs font-bold">A+</button>
        <button id="btn-annotations" class="p-2 rounded-lg 
                hover:bg-[#e8e0d0] dark:hover:bg-[#333]">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" 
               stroke-width="2" viewBox="0 0 24 24">
            <path d="M12 20h9M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/>
          </svg>
        </button>
      </div>
    </div>

    <!-- Área de renderização do livro -->
    <div id="epub-viewer" class="flex-1 hidden"></div>
    <canvas id="pdf-viewer" class="flex-1 w-full"></canvas>

    <!-- Rodapé do leitor -->
    <div id="reader-footer" 
         class="absolute bottom-0 left-0 right-0 flex justify-between 
                px-6 py-2 text-xs opacity-40 z-30">
      <span id="page-progress"></span>
      <span id="percent-read"></span>
    </div>
  </div>

  <!-- ═══════════════ PAINEL DE ANOTAÇÕES ═══════════════ -->
  <div id="annotations-panel" 
       class="fixed right-0 top-0 h-full w-80 bg-[#faf7f0] dark:bg-[#222] 
              shadow-2xl z-40 transform translate-x-full transition-transform 
              duration-300 overflow-y-auto">
    <div class="flex items-center justify-between p-4 border-b 
                border-[#e0d8c8] dark:border-[#333]">
      <h2 class="font-semibold">Anotações</h2>
      <button id="btn-close-annotations" class="p-1 rounded hover:bg-[#e8e0d0] 
              dark:hover:bg-[#333]">✕</button>
    </div>
    <div id="annotations-list" class="p-4 space-y-3"></div>
    <div class="p-4 border-t border-[#e0d8c8] dark:border-[#333]">
      <button id="btn-export-wifi" class="w-full py-2 rounded-lg 
              bg-[#2d2d2d] dark:bg-[#b0b0b0] text-[#f5f0e8] dark:text-[#1a1a1a] 
              text-sm font-medium">
        Exportar via Wi-Fi
      </button>
    </div>
  </div>

  <!-- Overlay para toque de controlo -->
  <div id="touch-overlay" class="fixed inset-0 z-15"></div>

  <script src="js/storage.js"></script>
  <script src="js/night-mode.js"></script>
  <script src="js/annotations.js"></script>
  <script src="js/epub-reader.js"></script>
  <script src="js/pdf-reader.js"></script>
  <script src="js/sync.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
